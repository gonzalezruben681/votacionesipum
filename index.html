<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="votaciones_update">
  <!-- 2.1 Meta viewport para responsive en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- :contentReference[oaicite:7]{index=7} -->

  <!-- Iconos y manifest -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="votaciones_update">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>votaciones_update</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- 2.2 jsQR para el fallback web -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script> <!--  -->

  <!-- 2.3 Script para playsinline y muted en todos los <video> -->
  <script>
    window.addEventListener('load', () => {
      document.querySelectorAll('video').forEach(v => {
        v.setAttribute('playsinline', '');  // evita pantalla completa 
        v.setAttribute('muted', '');       // necesario para autoplay en algunos móviles
        v.play().catch(() => {});
      });
    });
  </script>

  <!-- Estilos para object-fit en video -->
  <style>
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* llena el contenedor sin deformar :contentReference[oaicite:10]{index=10} */
    }
  </style>

  
</body>
</html>
